<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        body { text-align:center; font-family:Arial; background:#f0f2f5; }
        .box {
            background:white;
            padding:20px;
            display:inline-block;
            margin-top:50px;
            border-radius:10px;
        }
        input, button {
            padding:10px;
            margin:10px;
        }
    </style>
</head>

<body>

<h2>Add Student Iris</h2>

<div class="box">
    <input type="text" id="studentId" placeholder="Enter Student ID"><br>
    <input type="text" id="studentName" placeholder="Enter Student Name"><br>
    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" width="400" height="300"></canvas><br>

    <button onclick="capture()">Capture & Save</button>
    <button onclick="goBack()">Back</button>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const faceMesh = new FaceMesh({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true
    });

    faceMesh.onResults(results => {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        if (results.multiFaceLandmarks.length > 0) {

            const landmarks = results.multiFaceLandmarks[0];
            const irisPoints = [469,470,471,472];

            let minX=9999,minY=9999,maxX=0,maxY=0;

            irisPoints.forEach(i=>{
                const x = landmarks[i].x * canvas.width;
                const y = landmarks[i].y * canvas.height;

                minX = Math.min(minX,x);
                minY = Math.min(minY,y);
                maxX = Math.max(maxX,x);
                maxY = Math.max(maxY,y);
            });

            const pad = 20;

            ctx.drawImage(
                video,
                minX-pad, minY-pad,
                (maxX-minX)+pad*2,
                (maxY-minY)+pad*2,
                0,0,canvas.width,canvas.height
            );
        }
    });

    const camera = new Camera(video,{
        onFrame: async ()=> await faceMesh.send({image:video}),
        width:400,
        height:300
    });

    camera.start();

    async function capture() {
        const studentId = document.getElementById("studentId").value;
        const studentName = document.getElementById("studentName").value;

        if (!studentId || !studentName) {
            alert("Enter Student ID and Name");
            return;
        }

        const blob = await new Promise(resolve =>
            canvas.toBlob(resolve,'image/jpeg')
        );

        const formData = new FormData();
        formData.append("file", blob);
        formData.append("studentId", studentId);
        formData.append("studentName", studentName);
        const res = await fetch("/student/save", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        alert(data.message);
    }

    function goBack() {
        window.location.href = "home.html";
    }
</script>

</body>
</html>
